<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>nchecknet</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
</head>

<body style="background: var(--bs-light-bg-subtle);">
    <div style="padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;">
        <img src="/assets/img/logo.svg" alt="nchecknet" style="height: 50px;">
        <button id="logoff" type="button" style="background-color: #1d4ed8; border-color: #1e3a8a; color: white;" class="btn btn-sm">Log off</button>
    </div>
    <div>
        <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" href="#tab-1">Systems</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link active" role="tab" data-bs-toggle="tab" id="charttabitem" href="#tab-2">Charts</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" id="datatabitem" href="#tab-3">Data</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" id="alertstabitem" href="#tab-4">Server Alerts</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" id="nmpalertstabitm" href="#tab-5">Nmap Alerts</a></li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane" role="tabpanel" id="tab-1">
                <div class="container">
                    <div class="row" style="height: 20px;"></div>
                    <div class="row" style="height: 140px;">
                        <div class="col col-xl-2"><select id="Servers" style="width: 200px;">
                                <optgroup label="Servers"></optgroup>
                            </select></div>
                        <div class="col col-xl-2"><select id="SessionIDs" style="width: 100px;">
                                <optgroup label="Sessions">
                                    <option value="12" selected="">--</option>
                                </optgroup>
                            </select></div>
                        <div class="col"></div>
                    </div>
                </div>
                <div class="container">
                    <div class="col">
                        <div id="nmapsuggestion"></div>
                    </div>
                </div>

            </div>
            <div class="tab-pane active" role="tabpanel" id="tab-2">
                <div class="container" style="height: 20px;"></div>
                <div class="container">
                    <div class="row">
                        <div class="col col-lg-5"><select id="charttype" name="Chart">
                                <optgroup label="Charts">
                                    <option value="select" selected="">Select</option>
                                    <option value="fwlistenchart">FwAllow</option>
                                    <option value="nmapchart">Nmap</option>
                                </optgroup>
                            </select></div>
                        <div class="col"></div>
                        <div class="col">
                            <div class="row">
                                <div class="col">
                                    <div class="form-check" id="hide-hide"><input class="form-check-input" type="checkbox" id="charthide"><label class="form-check-label" for="formCheck-1">Show hidden&nbsp; objects</label></div>
                                </div>
                            </div>
                            <div class="row" id="baseline-server">
                                <div class="col">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="baseline-server-val"><label class="form-check-label" for="formCheck-2">Set Server baseline</label></div>
                                </div>
                                <div class="col"><span>Current:</span><span id="baseline-server-id" style="margin-left: 5px;">TextS</span></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="container">
                    <div class="row">
                        <div class="col" id="chartreport"></div>
                    </div>
                </div>
            </div>
            <div class="tab-pane" role="tabpanel" id="tab-3">
                <div class="container">
                    <div class="row">
                        <div class="col" id="DataTabCol1"></div>
                    </div>
                </div>
            </div>
            <div class="tab-pane" role="tabpanel" id="tab-4">
                <div class="container" style="height: 20px;"></div>
                <div class="container">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="alerts-all-sessions">
                        <label class="form-check-label" for="alerts-all-sessions">Show all sessions</label>
                    </div>
                </div>
                <div class="container" style="margin-top: 10px;">
                    <div id="ServerAlertsTable"></div>
                </div>
            </div>
            <div class="tab-pane" role="tabpanel" id="tab-5">
                <div class="container" style="height: 20px;"></div>
                <div class="container">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="nmapalerts-all-sessions">
                        <label class="form-check-label" for="nmapalerts-all-sessions">Show all sessions</label>
                    </div>
                </div>
                <div class="container" style="margin-top: 10px;">
                    <div id="NmapAlertsTable"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="/js/mermaid.tiny.js"></script>
    <script src="/js/nchecknet.js"></script>
    <footer style="text-align: center; font-size: 12px; color: var(--bs-secondary-color); padding: 12px 0; margin-top: 20px; border-top: 1px solid var(--bs-border-color);">
        &copy; CC0-1.0 license 2025&ndash;<script>document.write(new Date().getFullYear())</script> nchecknet
    </footer>
</body>

</html>
