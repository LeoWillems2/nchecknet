<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nchecknet Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; display: inline-block; border: 1px solid #ccc; border-box: border-box; }
        button { background-color: #c2ddf8; color: white; padding: 14px 20px; margin: 8px 0; border: none; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.8; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 16px;">
        <img src="/assets/img/logo.svg" alt="nchecknet" style="max-width: 100%;">
    </div>
    <form id="loginForm">
        <label for="username"><b>Username</b></label>
        <input type="text" placeholder="Enter Username" name="username" required>

        <label for="password"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="password" required>
        
        <button type="submit">Login</button>
    </form>

    <div id="message"></div>

    <hr>
    <footer style="text-align: center; font-size: 12px; color: #6c757d; margin-top: 10px;">
        &copy; CC0-1.0 license 2025&ndash;<script>document.write(new Date().getFullYear())</script> nchecknet
    </footer>

</body>
<script src="/js/login.js"></script>
</html>
