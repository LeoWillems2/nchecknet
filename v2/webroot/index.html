<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nchecknet Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; display: inline-block; border: 1px solid #ccc; border-box: border-box; }
        button { background-color: #c2ddf8; color: white; padding: 14px 20px; margin: 8px 0; border: none; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.8; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>🔐 Login to Nchecknet</h2>
    <form id="loginForm">
        <label for="username"><b>Username</b></label>
        <input type="text" placeholder="Enter Username" name="username" required>

        <label for="password"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="password" required>
        
        <button type="submit">Login</button>
    </form>

    <div id="message"></div>
    
    <hr>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        serverUrl = String(window.location);
	if ( serverUrl.slice(-1) === '/'){
		serverUrl = serverUrl.substr(0,serverUrl.length-1);
	}

        // Helper function to display messages
        function displayMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = type;
        }

        // --- Login Function ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            const data = Object.fromEntries(formData.entries());

            try {
                // We must add {credentials: 'include'} so the browser sends any existing cookie
                // and, more importantly, accepts the 'Set-Cookie' header from the server response.
                const response = await fetch(`${serverUrl}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include' 
                });

                if (response.ok) {
                    const resultText = await response.text();
                    // The server response says: "Login successful. JWT set in HTTP-only cookie."
                    displayMessage(`SUCCESS: ${resultText}`, 'success');
		    window.location.assign("main.html");
		    //await accessProtected();
                } else {
                    const errorText = await response.text();
                    displayMessage(`LOGIN FAILED (${response.status}): ${errorText}`, 'error');
                }
            } catch (error) {
                displayMessage(`Network Error: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
